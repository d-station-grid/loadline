name: api-ci

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loadline
          POSTGRES_PASSWORD: loadline
          POSTGRES_DB: loadline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadline -d loadline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://loadline:loadline@localhost:5432/loadline
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: install
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run mypy app tests scripts

      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run pytest

      - name: openapi.json is up to date
        if: ${{ !cancelled() }}
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code openapi.json
