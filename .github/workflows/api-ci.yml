name: api-ci

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: install
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run mypy app tests scripts

      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run pytest

      - name: openapi.json is up to date
        if: ${{ !cancelled() }}
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code openapi.json
