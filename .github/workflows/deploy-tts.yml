name: deploy-tts

# main に入った tts/ の変更を Cloud Run の tts へ。api は deploy.yml で出す。
# モデル（約 350MB）は Git に入れていないので、組み立ての前に Cloud Storage からコピーする
on:
  push:
    branches: [main]
    paths:
      - "tts/**"
      - ".github/workflows/deploy-tts.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation で GCP に入るのに要る

# 続けてマージしたときに並べて走らせない。来た順に 1 つずつ走らせ、待っている実行は取り消さない
# （queue: max。既定の single では、古い実行の Re-run が最新の待ちを取り消してしまう）。
# 走っている実行は途中で止めない。古い実行は下の main との比較で出さずに終わる
concurrency:
  group: deploy-tts
  queue: max
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/loadline/tts
  RUNTIME_SA: loadline-tts@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  MODELS: gs://loadline-app-models/kokoro-v1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # tts/Dockerfile はこの 2 つを tts/ から COPY する
      - name: copy the model files
        run: |
          gcloud storage cp "$MODELS/kokoro-v1.0.onnx" "$MODELS/voices-v1.0.bin" tts/ \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: docker login (Artifact Registry)
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: build and push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" tts
          docker push "$IMAGE:${{ github.sha }}"

      # 古い実行の Re-run などで、古い版を出し直さない。今の main と比べて tts の中身が違えば、
      # もっと新しい変更があり、その実行が出すので、ここでは出さない。同じなら出してよい
      - name: check that main has the same tts
        id: main
        run: |
          git fetch --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- tts .github/workflows/deploy-tts.yml; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer tts changes; not deploying $GITHUB_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # 値は試作で測ったもの。2GiB で足り、1GiB では足りない。4 vCPU で 1 回の読み上げが約 10 秒。
      # 読み上げは 1 回で CPU を使い切るので、1 台に 1 件ずつ。費用を抑えるため、サービス全体で
      # 2 台まで（--max。--max-instances はリビジョンごとの上限）。
      # --timeout は 0 台からの起動（約 21 秒）と、最初の /speak でのモデルの読み込みを含めて 60 秒。
      # --cpu-boost は起動のあいだ CPU を足し、0 台から起き上がる時間を縮める。
      # 認証を必須にし、呼べるのは api のサービスアカウントだけ（Invoker は手で付ける）
      - name: deploy tts
        if: steps.main.outputs.current == 'true'
        run: |
          gcloud run deploy tts \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --cpu 4 --memory 2Gi --cpu-boost \
            --concurrency 1 --max 2 --timeout 60 \
            --quiet
