name: deploy

# main に入ったら api（web 同梱）を Cloud Run へ。tts は 6 段目で足す
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation で GCP に入るのに要る

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/loadline/api
  RUNTIME_SA: loadline-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: docker login (Artifact Registry)
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: build and push
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      # マイグレーションは同じイメージを Cloud Run Job として動かす。DB の URL は Secret Manager から
      - name: migrate
        run: |
          gcloud run jobs deploy api-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "$RUNTIME_SA" \
            --set-secrets DATABASE_URL=database-url:latest \
            --command alembic --args upgrade,head \
            --max-retries 0 --quiet
          gcloud run jobs execute api-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --wait --quiet

      - name: deploy api
        run: |
          gcloud run deploy api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --set-env-vars "APP_ENV=production,FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets DATABASE_URL=database-url:latest \
            --quiet
