name: deploy

# main に入ったら api（web 同梱）を Cloud Run へ。tts は deploy-tts.yml で出す
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation で GCP に入るのに要る

# 続けてマージしたときに並べて走らせない。待ちに並ぶのは 1 つだけで、新しい実行が来ると
# 待っていた古い実行は取り消される。走っている実行は途中で止めない（マイグレーションの途中で切らない）
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/loadline/api
  RUNTIME_SA: loadline-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  # 振り返りを自動で作る。Scheduler と Tasks はこの URL を呼び、invoker の OIDC トークンを付ける
  API_URL: https://api-qbvpsx77dq-an.a.run.app
  INVOKER_SA: loadline-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  TASKS_QUEUE: projects/${{ vars.GCP_PROJECT_ID }}/locations/asia-northeast1/queues/weekly-reviews

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: docker login (Artifact Registry)
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: build and push
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      # 古い実行の Re-run などで、古い版を出し直さない。今の main と比べて api の中身が違えば、
      # もっと新しい変更があり、その実行が出すので、ここでは出さない。同じなら出してよい。
      # マイグレーションより前で止める。古いコードは新しい revision を知らず、upgrade head が失敗するため
      - name: check that main has the same api
        id: main
        run: |
          git fetch --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- api web Dockerfile .dockerignore .github/workflows/deploy.yml; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer api changes; not deploying $GITHUB_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # マイグレーションは同じイメージを Cloud Run Job として動かす。DB の URL は Secret Manager から
      - name: migrate
        if: steps.main.outputs.current == 'true'
        run: |
          gcloud run jobs deploy api-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "$RUNTIME_SA" \
            --set-secrets DATABASE_URL=database-url:latest \
            --command alembic --args upgrade,head \
            --max-retries 0 --quiet
          gcloud run jobs execute api-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --wait --quiet

      # 振り返りのセリフは Gemini（Vertex AI）で書き、Jev で確かめる。Vertex AI は実行用の
      # サービスアカウントの権限（roles/aiplatform.user）で呼ぶ。Jev のキーは Secret Manager から。
      # Jev のキーがないと、Gemini が書いても話さずに定型にする
      - name: deploy api
        if: steps.main.outputs.current == 'true'
        run: |
          gcloud run deploy api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --set-env-vars "APP_ENV=production,FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},INTERNAL_AUDIENCE=$API_URL,INTERNAL_CALLER_EMAIL=$INVOKER_SA,TASKS_QUEUE=$TASKS_QUEUE,GEMINI_PROJECT=${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets DATABASE_URL=database-url:latest,TYPESAFE_API_KEY=typesafe-api-key:latest \
            --quiet
