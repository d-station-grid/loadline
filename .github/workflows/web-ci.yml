name: web-ci

on:
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: test
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: coverage summary
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo "## web のカバレッジ"
            echo
            echo "| | % | covered / total |"
            echo "|---|---:|---:|"
            jq -r '.total | to_entries[] | select(.key != "branchesTrue")
              | "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' \
              coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: src/api is up to date
        if: ${{ !cancelled() }}
        run: |
          npm run generate:api
          git diff --exit-code src/api
