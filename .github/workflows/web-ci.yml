name: web-ci

on:
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: test
        if: ${{ !cancelled() }}
        run: npm test

      - name: src/api is up to date
        if: ${{ !cancelled() }}
        run: |
          npm run generate:api
          git diff --exit-code src/api
