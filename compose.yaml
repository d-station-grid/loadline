services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: loadline
      POSTGRES_PASSWORD: loadline
      POSTGRES_DB: loadline
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadline -d loadline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
